rootProject.name = 'mahem_app'

// ---------------------------------------------------------------------------
// aapt2 override for compileSdk 35 (see gradle.properties for the why).
//
// AGP only accepts an absolute path for this, so gradle.properties carries a
// path that is valid for one machine only. Nothing can fix that from here:
// Gradle materialises the build's properties *before* this script runs, so a
// value published from settings evaluation — via startParameter, an extra
// property, or a system property — is never seen by AGP, and resource linking
// fails exactly as if no override had been configured. (AGP also resolves
// aapt2 through a detached configuration, so a resolutionStrategy that swaps
// the Maven artifact for a newer one never applies either.)
//
// So this checks rather than injects: when the configured path is missing or
// does not exist on this machine, the correct one is written into
// gradle.properties and the build stops asking to be re-run — the next run
// loads it normally. That keeps a fresh machine or CI one re-run away from a
// working build instead of dead, and the rewritten line is meant to be
// committed by whoever's SDK layout it describes.
// ---------------------------------------------------------------------------
def findLocalAapt2 = {
    def sdkDir = null
    def localProps = new File(settingsDir, 'local.properties')
    if (localProps.exists()) {
        def props = new Properties()
        localProps.withInputStream { props.load(it) }
        sdkDir = props.getProperty('sdk.dir')
    }
    if (!sdkDir) {
        sdkDir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    }
    if (!sdkDir) {
        def home = System.getProperty('user.home')
        def candidates = [new File(home, 'Library/Android/sdk'), new File(home, 'Android/Sdk')]
        sdkDir = candidates.find { it.isDirectory() }?.absolutePath
    }
    if (!sdkDir) {
        return null
    }

    // Prefer build-tools 35.x — the version whose aapt2 can read android-35.jar.
    // Falls back to the newest build-tools present, which on a machine that
    // has only newer ones is still correct.
    def buildTools = new File(sdkDir, 'build-tools')
    if (!buildTools.isDirectory()) {
        return null
    }
    def versions = buildTools.listFiles({ File f -> f.isDirectory() } as FileFilter)?.sort { it.name }
    def chosen = versions?.reverse()?.find { new File(it, 'aapt2').isFile() && it.name.startsWith('35.') }
    if (!chosen) {
        chosen = versions?.reverse()?.find { new File(it, 'aapt2').isFile() }
    }
    return chosen ? new File(chosen, 'aapt2').absolutePath : null
}

def aapt2Key = 'android.aapt2FromMavenOverride'
// -P on the command line wins outright and needs no file to back it.
if (!gradle.startParameter.projectProperties.containsKey(aapt2Key)) {
    def gradleProps = new File(settingsDir, 'gradle.properties')
    def configured = null
    if (gradleProps.exists()) {
        def props = new Properties()
        gradleProps.withInputStream { props.load(it) }
        configured = props.getProperty(aapt2Key)
    }

    if (!configured || !new File(configured).isFile()) {
        def resolved = findLocalAapt2()
        if (!resolved) {
            logger.lifecycle(
                'mahem: no local aapt2 found for the compileSdk 35 workaround — resource ' +
                'linking will fail with "RES_TABLE_TYPE_TYPE entry offsets overlap actual entry ' +
                'data". Install Android build-tools 35.0.0, or pass -P' + aapt2Key + '=<path>.')
        } else {
            def text = gradleProps.exists() ? gradleProps.text : ''
            def line = aapt2Key + '=' + resolved
            // Replace the stale line in place when there is one, so the comment
            // above it survives; otherwise append the whole block.
            if (text =~ /(?m)^\s*\Q${aapt2Key}\E\s*=.*$/) {
                text = text.replaceAll(/(?m)^\s*\Q${aapt2Key}\E\s*=.*$/, java.util.regex.Matcher.quoteReplacement(line))
            } else {
                text += (text.endsWith('\n') || text.isEmpty() ? '' : '\n') + '\n' +
                    '# aapt2 from the local SDK build-tools: AGP 7.4.2 ships aapt2 7.4.2, which\n' +
                    '# cannot parse the android-35 android.jar this project compiles against.\n' +
                    '# Absolute and therefore machine-specific — settings.gradle rewrites it\n' +
                    '# when it does not point at a real file on the machine doing the build.\n' +
                    line + '\n'
            }
            gradleProps.text = text
            throw new org.gradle.api.GradleException(
                'mahem: ' + (configured ? 'the configured aapt2 path does not exist on this machine' : 'no aapt2 override was configured') +
                ', so gradle.properties has been updated to ' + resolved + '. Gradle reads its ' +
                'properties before this script runs, so the value cannot take effect in the ' +
                'current build — re-run the same command and it will.')
        }
    }
}

apply from: file("../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesSettingsGradle(settings)
include ':react-native-vector-icons'
project(':react-native-vector-icons').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-vector-icons/android')
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

apply from: new File(["node", "--print", "require.resolve('expo/package.json')"].execute(null, rootDir).text.trim(), "../scripts/autolinking.gradle")
useExpoModules()
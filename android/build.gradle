// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        // API 35 (Android 15) is the floor Google Play enforces for new apps and
        // updates; an upload targeting 33 is rejected. The theme opts out of the
        // edge-to-edge enforcement that comes with it — see values-v35/styles.xml.
        buildToolsVersion = "35.0.0"
        minSdkVersion = 21
        compileSdkVersion = 35
        targetSdkVersion = 35

        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "23.1.7779620"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath 'com.google.gms:google-services:4.4.1'
    }
}

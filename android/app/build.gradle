apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
apply plugin: 'com.google.gms.google-services' // <- Add this line

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
    //
    // Added by install-expo-modules
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", rootDir.getAbsoluteFile().getParentFile().getAbsolutePath(), "android", "absolute"].execute(null, rootDir).text.trim())
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli')"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

/**
 * Upload-key credentials, kept out of source control (see .gitignore), so they
 * are simply absent on a machine that has only ever built debug. Loading them
 * must therefore stay optional — `assembleDebug` has to keep working without
 * them. What must NOT stay optional is *using* them: see the release build
 * type below, and the task-graph guard at the bottom of this file.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    ndkVersion rootProject.ext.ndkVersion

    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.mahem_app"
    defaultConfig {
        applicationId "com.mahem_app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (keystoreProperties['MAHEM_UPLOAD_STORE_FILE']) {
            release {
                storeFile file(keystoreProperties['MAHEM_UPLOAD_STORE_FILE'])
                storePassword keystoreProperties['MAHEM_UPLOAD_STORE_PASSWORD']
                keyAlias keystoreProperties['MAHEM_UPLOAD_KEY_ALIAS']
                keyPassword keystoreProperties['MAHEM_UPLOAD_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // No `?: signingConfigs.debug` fallback. That fallback meant a
            // machine without keystore.properties — which is every machine but
            // the one that generated it, since the file is gitignored — still
            // produced a "release" APK, signed with the debug key that ships
            // with the Android SDK and whose password is public. Play rejects
            // it, and anything sideloaded from it is signed by a key anyone
            // can forge. Left null here and enforced below, so the build fails
            // with an explanation instead of emitting that artifact.
            signingConfig signingConfigs.findByName('release')
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation project(':react-native-vector-icons')
    debugImplementation("com.facebook.flipper:flipper:${FLIPPER_VERSION}")
    debugImplementation("com.facebook.flipper:flipper-network-plugin:${FLIPPER_VERSION}") {
        exclude group:'com.squareup.okhttp3', module:'okhttp'
    }

    debugImplementation("com.facebook.flipper:flipper-fresco-plugin:${FLIPPER_VERSION}")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

/**
 * Refuse to build an unsigned/mis-signed release.
 *
 * Checked against the resolved task graph rather than at configuration time,
 * so `assembleDebug` and `./gradlew tasks` still work on a machine that has no
 * upload key — only a build that would actually package a release artifact
 * fails, and it fails before any of it is written.
 */
gradle.taskGraph.whenReady { graph ->
    def packagesRelease = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(?i)^(package|bundle)[A-Z].*Release$/
    }
    if (packagesRelease && android.buildTypes.release.signingConfig == null) {
        throw new GradleException(
            "Refusing to build a release artifact with no upload key.\n" +
            "  android/keystore.properties is missing (it is gitignored, so it does not\n" +
            "  travel with a clone) or does not define MAHEM_UPLOAD_STORE_FILE.\n" +
            "  It must contain:\n" +
            "    MAHEM_UPLOAD_STORE_FILE=mahem-release.keystore\n" +
            "    MAHEM_UPLOAD_STORE_PASSWORD=...\n" +
            "    MAHEM_UPLOAD_KEY_ALIAS=mahem\n" +
            "    MAHEM_UPLOAD_KEY_PASSWORD=...\n" +
            "  with the keystore itself at android/app/. Both are handed over out of\n" +
            "  band — see README.md. Google Play only ever accepts updates signed by\n" +
            "  this key, so it cannot be regenerated if lost.")
    }
}
